<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multilingual Video OCR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <h1 class="app-title">Multilingual Video OCR</h1>
            <p class="app-description">Upload a video and extract text in real-time using advanced OCR technology</p>
        </div>

        <!-- Upload Card -->
        <div class="card">
            <div class="card-header">
                <span><i class="fas fa-upload"></i> Upload Video</span>
            </div>
            <div class="card-body">
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="input-group">
                        <input type="file" name="video" class="form-control" accept="video/mp4,video/mov,video/avi" required>
                        <button class="btn btn-primary" type="submit">
                            <i class="fas fa-cloud-upload-alt"></i> Upload
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Video Player Card -->
        <div class="card">
            <div class="card-header">
                <span><i class="fas fa-video"></i> Video Player</span>
                
                <!-- Language Selector -->
                <div class="language-selector d-inline-block">
                    <select id="languageSelector" class="form-select form-select-sm">
                        <option value="eng">English</option>
                        <!-- Other languages will be populated via JavaScript -->
                    </select>
                </div>
            </div>
            <div class="card-body">
                <div class="video-container">
                    <video id="videoPlayer" controls style="display: none;"></video>
                    <div id="processingOverlay">
                        <div class="text-center">
                            <div class="spinner-border text-light mb-3" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <div>Processing video...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="stats-container">
            <div class="stat-card">
                <h3>Frames Processed</h3>
                <div id="totalFrames" class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>Text Detected</h3>
                <div id="textDetected" class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>Current Time</h3>
                <div id="currentTime" class="value">0.00s</div>
            </div>
        </div>

        <!-- Results Row -->
        <div class="row">
            <!-- Detected Text Card -->
            <div class="col-md-7">
                <div class="card">
                    <div class="card-header">
                        <span><i class="fas fa-file-alt"></i> Detected Text</span>
                    </div>
                    <div class="card-body">
                        <div id="ocrText" class="shadow-sm">Waiting for video...</div>
                    </div>
                </div>
            </div>
            
            <!-- History Card -->
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">
                        <span><i class="fas fa-history"></i> Text History</span>
                    </div>
                    <div class="card-body">
                        <ul id="historyList" class="history-list">
                            <!-- Text history will be added here -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Download Button -->
        <div class="text-end mt-3">
            <button id="downloadCsv" class="btn btn-success" disabled>
                <i class="fas fa-download"></i> Download CSV
            </button>
        </div>
    </div>
    
    <!-- Help Modal -->
    <div class="modal fade" id="helpModal" tabindex="-1" aria-labelledby="helpModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="helpModalLabel">Language Pack Help</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalHelpContent">
                    <!-- Content will be dynamically added -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
